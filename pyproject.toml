[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praxis-agents"
version = "0.1.0"
description = "Put your engineering best practices into practice, across every AI coding agent."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Chitra Kumar Sai Chenuri Venkata" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "anthropic>=1.11.0",
    "pytest>=8",
]
judge = [
    "anthropic>=1.11.0",
]

[project.scripts]
praxis = "praxis.cli:main"

[project.urls]
Homepage = "https://github.com/chitrakumarsai/praxis-agents"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
