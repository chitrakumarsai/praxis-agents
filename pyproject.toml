[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praxis-agents"
version = "0.1.0"
description = "Put your engineering best practices into practice, across every AI coding agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Chitra Kumar Sai Chenuri Venkata" }]
keywords = [
    "ai-agents", "coding-agents", "agents-md", "agent-skills", "claude-code", "codex",
    "cursor", "github-copilot", "llm", "code-review", "engineering-standards",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "anthropic>=1.11.0",
    "openai>=3.22.1",
    "pytest>=8",
]
judge = [
    "anthropic>=1.11.0",
]
judge-openai = [
    "openai>=3.22.1",
]

[project.scripts]
praxis = "praxis_agents.cli:main"

[project.urls]
Homepage = "https://github.com/chitrakumarsai/praxis-agents"
Repository = "https://github.com/chitrakumarsai/praxis-agents"
Issues = "https://github.com/chitrakumarsai/praxis-agents/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis_agents"]

[tool.hatch.build.targets.sdist]
# The calibration evals and planning notes live in the repo, not in the release.
exclude = ["/evals", "/ideas.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
