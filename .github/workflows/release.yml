# Publishes to TestPyPI, then PyPI, when a GitHub release is published.
# Uses trusted publishing (OIDC): no API token is stored anywhere. Requires a trusted publisher on
# test.pypi.org and pypi.org for this repo, workflow "release.yml", and environments "testpypi"
# and "pypi".
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

# One release at a time, and never cancel a publish that is already running.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match pyproject version $version (expected v$version)"
            exit 1
          fi
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
      - run: uv build
      - run: uv run --no-project --with twine twine check --strict dist/*
      - name: Smoke-test the built wheel
        run: uv run --isolated --no-project --with dist/*.whl praxis --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/praxis-agents/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # --check-url skips files already uploaded, so re-running a partly failed release is safe.
      - run: >-
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/
          dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/praxis-agents/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
